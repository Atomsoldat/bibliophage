syntax = "proto3";

package bibliophage.v1alpha3;

import "bibliophage/v1alpha3/common.proto";
import "google/protobuf/timestamp.proto";

// Service definitions - the API endpoints
service PdfService {
  rpc LoadPdf(LoadPdfRequest) returns (LoadPdfResponse);
}

// ============================================================================
// Data Objects - Reusable entities that represent core domain models
// ============================================================================

// Pdf represents a PDF document in the system
// Does not actually contain the raw data, only metadata
message Pdf {
  // Unique identifier for this PDF (assigned by the backend)
  string id = 1;

  // Human-readable name (e.g., "Monster Manual", "Player's Handbook")
  string name = 2;

  // Which RPG system(s) this belongs to
  // Examples:
  //   Single system: ["Call of Cthulhu"]
  //   Multi-system: ["D&D 3.5e", "Pathfinder 1e"]
  //   System-agnostic: ["Generic"]
  // Must contain at least one value
  repeated string systems = 3;

  // Type of publication (e.g., "Core Rulebook", "Adventure", "Supplement")
  string type = 4;

  // Number of pages in the PDF
  int32 page_count = 5;

  // When this PDF was first loaded into the system
  google.protobuf.Timestamp created_at = 6;

  // When this PDF was last updated
  google.protobuf.Timestamp updated_at = 7;

  // File size in bytes
  int64 file_size = 8;

  // Number of batches processed by Docling (usually corresponds to chapters/sections)
  int32 batch_count = 9;

  // Number of text chunks created for vector embeddings
  int32 vector_chunk_count = 10;

  // Structured tags for organization (name + multiple values)
  repeated Tag tags = 11;

  // Markdown content extracted from the PDF (optional, only populated for GetPdf)
  // Contains concatenated markdown from all processed batches
  // Not included in search results to keep responses lightweight
  optional string content = 12;
}

// PdfListItem represents a PDF in list/search results
// Contains metadata only - never includes the actual PDF file data
// Structurally identical to Pdf, but semantically distinct for search responses
// This separation ensures future changes to search results don't affect other operations
message PdfListItem {
  // Unique identifier for this PDF
  string id = 1;

  // Human-readable name
  string name = 2;

  // Which RPG system(s) this belongs to (see Pdf message for examples)
  repeated string systems = 3;

  // Type of publication
  string type = 4;

  // Number of pages in the PDF
  int32 page_count = 5;

  // When this PDF was first loaded into the system
  google.protobuf.Timestamp created_at = 6;

  // When this PDF was last updated
  google.protobuf.Timestamp updated_at = 7;

  // File size in bytes
  int64 file_size = 8;

  // Number of batches processed by Docling
  int32 batch_count = 9;

  // Number of text chunks created for vector embeddings
  int32 vector_chunk_count = 10;

  // Structured tags for organization
  repeated Tag tags = 11;
}

// ============================================================================
// Request/Response Messages - Operation-specific wrappers
// ============================================================================

// LoadPdfRequest - Load a PDF into the system
message LoadPdfRequest {
  // The PDF document metadata to load
  Pdf pdf = 1;

  // The actual PDF file data (bytes)
  bytes file_data = 2;
}

// LoadPdfResponse - Result of loading a PDF
message LoadPdfResponse {
  // Whether the operation succeeded
  bool success = 1;

  // Human-readable status/error message
  string message = 2;

  // The loaded PDF with assigned ID and metadata
  Pdf pdf = 3;
}
