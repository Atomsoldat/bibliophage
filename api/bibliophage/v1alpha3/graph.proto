syntax = "proto3";

package bibliophage.v1alpha3;

import "bibliophage/v1alpha3/document.proto";
import "google/protobuf/struct.proto";

// ============================================================================
// Graph Service - Manage nodes and edges in the knowledge graph
// ============================================================================

service GraphService {
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc CreateEdge(CreateEdgeRequest) returns (CreateEdgeResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  rpc DeleteEdge(DeleteEdgeRequest) returns (DeleteEdgeResponse);

  // Return the neighbours (one hop) of a given node along with the edges
  // connecting them. Used by the graph view to expand a node on demand.
  rpc GetNeighbours(GetNeighboursRequest) returns (GetNeighboursResponse);

  // Return every edge whose endpoints both lie in the provided node set.
  // Used to draw edges between nodes that are already in the client's
  // view (e.g. after a search adds a new node next to existing ones).
  rpc ListEdges(ListEdgesRequest) returns (ListEdgesResponse);
}

// ============================================================================
// Data Objects
// ============================================================================

// Node represents a vertex in the knowledge graph
message Node {
  // Unique identifier (assigned by the system)
  string id = 1;

  // Type identifier (e.g., "character", "location", "document")
  // References a TypeDefinition
  string type_id = 2;

  // Dynamic properties validated against the type's schema
  // Struct works like JSON
  google.protobuf.Struct properties = 3;
}

// Edge represents a relationship between two nodes
message Edge {
  // Unique identifier (assigned by the system)
  string id = 1;

  // Relationship type (e.g., "located_in", "knows", "owns")
  string relationship = 2;

  // Whether this edge has a direction (A → B vs A — B)
  bool directed = 3;

  // Source node ID (or "node A" for undirected edges)
  string node_a = 4;

  // Target node ID (or "node B" for undirected edges)
  string node_b = 5;
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message CreateNodeRequest {
  // Type identifier for this node
  string type_id = 1;

  // Properties for this node (validated against type schema)
  google.protobuf.Struct properties = 2;
}

message CreateNodeResponse {
  bool success = 1;
  string message = 2;

  // The created node with assigned ID
  Node node = 3;
}

message CreateEdgeRequest {
  // Relationship type (e.g., "located_in", "member_of")
  string relationship = 1;

  // Whether this edge is directed
  bool directed = 2;

  // Source node ID
  string source_node_id = 3;

  // Target node ID
  string target_node_id = 4;
}

message CreateEdgeResponse {
  bool success = 1;
  string message = 2;

  // The created edge with assigned ID
  Edge edge = 3;
}

message DeleteNodeRequest {
  string id = 1;
}

message DeleteNodeResponse {
  bool success = 1;
  string message = 2;
}

message DeleteEdgeRequest {
  string id = 1;
}

message DeleteEdgeResponse {
  bool success = 1;
  string message = 2;
}

// Fetch all neighbours of a single node in one round-trip.
message GetNeighboursRequest {
  // ID of the node whose neighbourhood should be returned
  string document_id = 1;
}

message GetNeighboursResponse {
  bool success = 1;
  string message = 2;

  // Lightweight summaries of every adjacent document.
  // Use DocumentService.GetDocument to retrieve full content.
  repeated DocumentListItem neighbours = 3;

  // Every edge incident to the requested node
  repeated Edge edges = 4;
}

// Fetch every edge whose endpoints both lie in the provided node set.
message ListEdgesRequest {
  // IDs of nodes to consider. Only edges with both endpoints in this
  // set are returned.
  repeated string document_ids = 1;
}

message ListEdgesResponse {
  bool success = 1;
  string message = 2;

  repeated Edge edges = 3;
}
