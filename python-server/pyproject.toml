[project]
name = "bibliophage-data-server"
version = "0.1.0"
description = "Bibliophage data server"
authors = [
    {name = "Leon Welchert", email = "lichturm@posteo.de"}
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# TODO: It seems like  most of the crazy ML libraries are
# made more conveniently available via pypi, when it comes to bundled CUDA
# at that point we might need to ask ourselves why we use conda to begin with
[tool.pixi.dependencies]
python = ">=3.12"
langchain-postgres = ">=0.0.15,<0.0.16"
langchain-huggingface = ">=0.3.1,<0.4"
pypdf = ">=6.6.0,<7"
grpcio = ">=1.73.1,<2"
grpcio-tools = ">=1.73.1,<2"
grpcio-reflection = ">=1.45.0,<2"
fastapi = ">=0.128.0,<0.129"
uvicorn = ">=0.40.0,<0.41"
ruff = ">=0.14.13,<0.15"
pytest = ">=9.0.2,<10"
pytest-asyncio = ">=1.3.0,<2"
pydantic-settings = ">=2.12.0,<3"
python-dotenv = ">=1.2.1,<2"
vulture = ">=2.14,<3"
pymupdf = ">=1.26.1,<2"
pymongo = ">=4.16.0,<5"
docling = ">=2.45.0,<3"
psutil = ">=7.2.1,<8"
pgvector-python = ">=0.3.5,<0.4"
psycopg = ">=3.2.10,<4"

[tool.pixi.feature.gpu.dependencies]
# read here https://pixi.prefix.dev/dev/python/pytorch
pytorch-gpu = ">=2.9.1,<3"

[tool.pixi.feature.gpu.system-requirements]
# "this needs to be provided by the environment"
cuda = "12.4"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = ">=2.9.1,<3"

[tool.pixi.environments]
# which features belong to which environment (i think)
default = ["cpu"]
cpu = ["cpu"]
gpu = ["gpu"]

[tool.pixi.pypi-dependencies]
langchain-community = ">=0.3.31, <0.4"
langchain = ">=0.3.27, <0.4"
langchain-core = "*"
connect-python = ">=0.7.1, <0.8"
protoc-gen-connect-python = ">=0.7.1, <0.8"
ty = ">=0.0.13, <0.0.14"
deptry = ">=0.24.0, <0.25"

[tool.pixi.tasks.dev]
cmd = ["python",
        "-m",
        "uvicorn",
        "--reload",
        "src.server:api_server",
]
# we don't want to spread our env vars all over the place
# for now let's work with the Tiltfile
# env = {PYTHONPATH = 'src'}

[tool.pixi.tasks.gen_proto]
cmd = [
    "python", "-m", "grpc_tools.protoc",
    "--proto_path=../api",
    "--connect-python_out=./src",
    "--python_out=./src",
    "--pyi_out=./src",
    "../api/bibliophage/v1alpha3/*.proto"
]
description = "Generate protobuf code"

[tool.pixi.tasks.touch_inits]
cmd = [
    "touch",
    "src/bibliophage/__init__.py",
    "src/bibliophage/v1alpha3/__init__.py",
]
description = "Create __init__.py files"

[tool.pixi.tasks.api]
depends-on = ["gen_proto", "touch_inits"]

[tool.pixi.tasks.lint]
depends-on = ["linter", "types", "deps", "ded"]

[tool.pixi.tasks.linter]
cmd = ["ruff", "check"]

[tool.pixi.tasks.types]
cmd = ["ty", "check"]

[tool.pixi.tasks.deps]
cmd = ["deptry", "."]

[tool.pixi.tasks.tests]
cmd = ["pytest", "tests"]


[tool.pixi.tasks.ded]
cmd = ["vulture", ".", "--exclude", "bibliophage,.pixi,.mypy_cache,__pycache__,__pytest_cache,.ruff_cache"]

[tool.pytest.ini_options]
# Async support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Python path configuration - allows importing from src/
pythonpath = ["src"]

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Logging configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

# Output options
addopts = [
    "-v",                     # Verbose output
    "--strict-markers",       # Raise error on unknown markers
    "--tb=short",            # Shorter traceback format
]

# Markers for categorizing tests
markers = [
    "integration: Integration tests that require running services",
    "unit: Fast unit tests with no external dependencies",
    "slow: Tests that take a long time to run",
]
