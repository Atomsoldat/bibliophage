[project]
name = "bibliophage-data-server"
version = "0.1.0"
description = "Bibliophage data server"
authors = [
    {name = "Leon Welchert", email = "lichturm@posteo.de"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "sentence-transformers>=5.5.0,<6",
    "langchain-postgres>=0.0.15,<0.0.16",
    "langchain-community>=0.3.31,<0.4",
    "langchain-huggingface>=0.3.1,<0.4",
    "langchain>=0.3.27,<0.4",
    "langchain-core",
    "pypdf>=6.6.0,<7",
    "grpcio>=1.73.1,<2",
    "grpcio-tools>=1.73.1,<2",
    "grpcio-reflection>=1.45.0,<2",
    "fastapi>=0.128.0,<0.129",
    "uvicorn>=0.40.0,<0.41",
    "pydantic-settings>=2.12.0,<3",
    "python-dotenv>=1.2.1,<2",
    "pymongo>=4.16.0,<5",
    "psutil>=7.2.1,<8",
    "pgvector>=0.3.5,<0.4",
    "psycopg>=3.2.10,<4",
    "connect-python>=0.7.1,<0.8",
    "protoc-gen-connect-python>=0.7.1,<0.8",
    "docling>=2.91.0,<3",
    "pymupdf>=1.26.1,<2",
    "datasets>=2.16.0",
    # torch is required but comes from a variant extra below (cpu/gpu/rocm)
]

[project.optional-dependencies]
# Install exactly one of these:
#   uv sync --extra cpu      (default, works everywhere)
#   uv sync --extra gpu      (NVIDIA, requires CUDA 12.x drivers)
#   uv sync --extra rocm     (AMD, requires ROCm 6.3 drivers)
cpu  = ["torch>=2.9.1,<3"]
gpu  = ["torch>=2.9.1,<3"]
rocm = ["torch>=2.9.1,<3", "pytorch-triton-rocm>=3.5.1,<4"]

# Dev/lint tools as a separate optional group
dev = [
    "ruff>=0.14.13,<0.15",
    "ty>=0.0.13,<0.0.14",
    "deptry>=0.24.0,<0.25",
    "vulture>=2.14,<3",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "coverage>=7.13.1,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tells hatchling that src/ is the root of the wheel. With this, src/server.py
# is installed as `server`, src/bibliophage/... as `bibliophage....`, etc.
# Combined with the editable self-install below, this puts src/ on sys.path
# without anyone needing to set PYTHONPATH.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# ── uv: torch variant indexes ────────────────────────────────────────────
# explicit=true means the index is only consulted for packages that name it
# in [tool.uv.sources], so it won't accidentally pull other packages from
# PyTorch's index.
#
# conflicts: the cpu/gpu/rocm extras are mutually exclusive. Without this,
# uv tries to unify all extras in one lockfile solve and sees torch needing
# three different indexes simultaneously, which it rejects as a conflict.
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
        { extra = "rocm" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# ROCm version must match host drivers.
# Check supported versions at: https://pytorch.org/get-started/locally/
[[tool.uv.index]]
name = "pytorch-rocm63"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu",   extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
    { index = "pytorch-rocm63", extra = "rocm" },
]
# Transitive dep of torch+rocm — must be sourced from the ROCm index
# because the explicit flag prevents uv from finding it automatically.
pytorch-triton-rocm = { index = "pytorch-rocm63", extra = "rocm" }

# ── pytest ────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
# Async support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Python path configuration - allows importing from src/
pythonpath = ["src"]

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Logging configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

# Output options
addopts = [
    "-v",                     # Verbose output
    "--strict-markers",       # Raise error on unknown markers
    "--tb=short",            # Shorter traceback format
]

# Markers for categorizing tests
markers = [
    "integration: Integration tests that require running services",
    "unit: Fast unit tests with no external dependencies",
    "slow: Tests that take a long time to run",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/bibliophage/*_pb2.py",
    "__init__.py"
]

[tool.coverage.report]
# https://coverage.readthedocs.io/en/7.13.1/config.html#report-exclude-lines
exclude_lines = [
    # if we want to specifically exclude a line or block
    "pragma: no cover",
    # ignore stuff related to type checkers like mypy and pyright
    "if TYPE_CHECKING:",
]
show_missing = true
