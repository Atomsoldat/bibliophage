# https://docs.astral.sh/ruff/settings/
# https://docs.astral.sh/ruff/configuration/
# https://docs.astral.sh/ruff/rules/
exclude = [
    # ignore auto generated
    "src/bibliophage",
    # ignore other common stuff
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]



# https://docs.astral.sh/ruff/rules/
[lint]
select = ["ALL"]

ignore = [
    # less squiggles for now...
    "D",
    # once we have the code in a shape we like, we can think about line length
    "E501",
    # we use TODO and friends for documentation purposes
    "FIX001",
    # incorrect-blank-line-before-class
    # enforces blank lines between class definition and docstring
    # this conflicts with the default black-style formatting, that ruff enforces
    # we would like to use this rule though, so maybe in the future,
    # it will be configurable?
    #https://github.com/astral-sh/ruff/issues/12220
    "D203",
    # blank-line-before-class (give stuff space to breathe)
    "D211",
    # multi-line-summary-first-line (putting the first line of the docstring on the same line
    # as the quotation marks clashes with our bracing)
    "D212",
    # the formatter enforces an identical rule, making this one redundant
    # devs say leaving it in may cause trouble
    "COM812",
    # copyright, lmao
    "CPY001",
    # we will think about this once we have multiple authors
    "TD002",
    # mandatory issues for todos
    "TD003",
]

[lint.per-file-ignores]
"tests/**.py" = ["S101"]
