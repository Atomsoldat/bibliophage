# https://docs.astral.sh/ruff/settings/
# https://docs.astral.sh/ruff/configuration/
# https://docs.astral.sh/ruff/rules/
exclude = [
    # ignore auto generated
    "src/bibliophage",
    # ignore other common stuff
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]



[lint]
select = ["ALL"]

ignore = [
    # we use TODO and friends for documentation purposes
    "FIX001",
]

[lint.per-file-ignores]
"tests/**.py" = ["S101"]
