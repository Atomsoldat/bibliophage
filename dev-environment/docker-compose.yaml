services:
  # PostgreSQL with pgvector extension for vector DB 
  postgres-pgvector:
    image: pgvector/pgvector:pg18-trixie
    container_name: bibliophage-postgres-pgvector
    restart: on-failure:3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pgvector
      - POSTGRES_PASSWORD=pgvector_dev
      - POSTGRES_DB=pgvector
    volumes:
      - postgres_pgvector_data:/var/lib/postgresql/
      - ./containers/postgres-pgvector/init-pgvector.sh:/docker-entrypoint-initdb.d/init-pgvector.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgvector"]
      interval: 10s
      timeout: 5s
      retries: 5

  #postgres-age:
  #  image: apache/age:latest
  #  container_name: bibliophage-postgres-age
  #  restart: unless-stopped
  #  ports:
  #    - "5434:5432"
  #  environment:
  #    - POSTGRES_USER=age
  #    - POSTGRES_PASSWORD=age_dev
