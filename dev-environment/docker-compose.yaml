  #  volumes:
  #    - postgres_age_data:/var/lib/postgresql/
  #  healthcheck:
  #    test: ["CMD-SHELL", "pg_isready -U age"]
  #    interval: 10s
  #    timeout: 5s
  #    retries: 5

  # Ollama for local LLM model serving with GPU acceleration
  ollama:
    image: ollama/ollama:latest
    container_name: bibliophage-ollama
    restart: on-failure:3
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./containers/ollama/init-ollama.sh:/init-ollama.sh:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Override entrypoint to run init script then start ollama
    # wait will continue executing until all background jobs (ollama serve) finish
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 5 && /init-ollama.sh && wait"]

  # ArcadeDB for graph database operations
  #arcadedb:
